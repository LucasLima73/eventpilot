version: 1
project:
  name: orders-platform
broker:
  type: redpanda
  version: latest
contracts:
  format: asyncapi
  path: ./contracts
services:
  - name: payment-service
    language: java
    produces:
      - payment.confirmed
    consumes:
      - order.created
topics:
  - name: order.created
    partitions: 3
    retention: 7d
    dlq: true
  - name: payment.confirmed
    partitions: 1
    retention: 7d
    dlq: false
features:
  dashboard: true
  metrics: true
  replay: true
  dlq:
    maxRetries: 5
    backoff: exponential
  outbox:
    enabled: true
    store: postgres
